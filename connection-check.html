<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未实现的人生 · 连接检查</title><link rel="icon" href="data:,"><style>body{font:17px/1.7 system-ui,sans-serif;background:#f5f0e6;color:#24352f;max-width:640px;margin:40px auto;padding:20px}button,a{font:inherit}button{padding:12px;margin:8px 0}pre{white-space:pre-wrap;background:white;padding:16px;border-radius:8px}a{color:#285e50}</style><h1>连接检查</h1><p>这是与游戏位于同一网站的轻量页面，不会收集或上传设备信息。它能帮助区分网站连接问题和完整游戏加载问题。</p><p id="script">页面已到达，正在检查 JavaScript。</p><button id="load" type="button">检查完整游戏文件下载</button><pre id="result">尚未下载游戏文件。</pre><p><a href="./">打开完整游戏</a></p><p>如果此小页面也无法打开，首先需要解决当前网络到这个网站的连接。如果这里能打开，而游戏下载长期停滞，请尝试切换 Wi-Fi 与移动网络，并把最后显示的状态告诉支持者。</p><script>(function(){var status=document.getElementById('script'),out=document.getElementById('result'),button=document.getElementById('load');status.textContent='JavaScript 已运行。';button.onclick=function(){button.disabled=true;var t=Date.now(),xhr=new XMLHttpRequest();out.textContent='正在连接游戏文件…';xhr.open('GET','./index.html?connection-check='+Date.now(),true);xhr.responseType='arraybuffer';xhr.timeout=60000;xhr.onprogress=function(e){out.textContent='已收到 '+e.loaded.toLocaleString()+' 字节；耗时 '+((Date.now()-t)/1000).toFixed(1)+' 秒'+(e.lengthComputable?' / 共 '+e.total.toLocaleString()+' 字节':'');};xhr.onload=function(){var bytes=xhr.response?xhr.response.byteLength:0;out.textContent='HTTP '+xhr.status+'；收到 '+bytes.toLocaleString()+' 字节；耗时 '+((Date.now()-t)/1000).toFixed(1)+' 秒。\n'+(xhr.status===200?'完整文件下载完成。若游戏仍卡住，问题可能在浏览器初始化，可将此结果交给支持者排查。':'服务器未返回正常游戏文件。');button.disabled=false;};xhr.onerror=function(){out.textContent='连接失败。可能是网络、DNS、TLS 或站点访问受限。';button.disabled=false;};xhr.ontimeout=function(){out.textContent+='\n60 秒内尚未完成，已停止此次测试。';button.disabled=false;};xhr.send();};})();</script></html>
